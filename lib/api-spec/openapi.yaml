components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        clientDb:
          type: string
          enum: [ok, error]
      required: [status, clientDb]

    # ── AUTH ──────────────────────────────────────────────────────────
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
        tenantSlug: { type: string }

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
        token: { type: string }

    UserProfile:
      type: object
      required: [id, email, name, role, tenantId, permissions]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { type: string }
        roleId: { type: string }
        tenantId: { type: string }
        tenantName: { type: string }
        permissions:
          type: array
          items: { type: string }
        avatarUrl: { type: ["string", "null"] }

    PasswordResetInput:
      type: object
      required: [newPassword]
      properties:
        newPassword: { type: string }

    # ── TENANT ────────────────────────────────────────────────────────
    Tenant:
      type: object
      required: [id, name, slug, status, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        status: { type: string, enum: [active, suspended, trial] }
        industry: { type: ["string", "null"] }
        contactEmail: { type: ["string", "null"] }
        contactPhone: { type: ["string", "null"] }
        packageId: { type: ["string", "null"] }
        packageName: { type: ["string", "null"] }
        workerCount: { type: ["integer", "null"] }
        createdAt: { type: string }

    TenantInput:
      type: object
      required: [name, slug, contactEmail]
      properties:
        name: { type: string }
        slug: { type: string }
        industry: { type: string }
        contactEmail: { type: string }
        contactPhone: { type: string }
        adminName: { type: string }
        adminPassword: { type: string }

    TenantUpdate:
      type: object
      properties:
