      type: object
      required: [batchId, bankName, format]
      properties:
        batchId: { type: string }
        bankName: { type: string }
        format: { type: string }

    # ── PAYSLIP ───────────────────────────────────────────────────────
    Payslip:
      type: object
      required: [id, workerId, workerName, month, grossPay, netPay, status]
      properties:
        id: { type: string }
        workerId: { type: string }
        workerName: { type: string }
        employeeCode: { type: string }
        month: { type: string }
        batchId: { type: string }
        grossPay: { type: number }
        netPay: { type: number }
        status: { type: string, enum: [generated, sent] }
        fileUrl: { type: ["string", "null"] }
        earnings:
          type: array
          items:
            type: object
            properties:
              head: { type: string }
              amount: { type: number }
        deductions:
          type: array
          items:
            type: object
            properties:
              head: { type: string }
              amount: { type: number }

    PayslipGenerationInput:
      type: object
      required: [batchId]
      properties:
        batchId: { type: string }
        workerIds:
          type: array
          items: { type: string }

    PayslipGenerationResult:
      type: object
      required: [total, generated, failed]
      properties:
        total: { type: integer }
        generated: { type: integer }
        failed: { type: integer }
        jobId: { type: ["string", "null"] }

    # ── COMPLIANCE ────────────────────────────────────────────────────
    ComplianceReport:
      type: object
      required: [month, reportType, rows, totals]
      properties:
        month: { type: string }
        reportType: { type: string }
        entityName: { type: ["string", "null"] }
        rows:
          type: array
          items:
            type: object
        totals: { type: object }

    MinWageException:
      type: object
      required: [workerId, workerName, state, minimumWage, actualWage]
      properties:
        workerId: { type: string }
        workerName: { type: string }
        employeeCode: { type: string }
        state: { type: string }
        zone: { type: ["string", "null"] }
        category: { type: string }
        minimumWage: { type: number }
        actualWage: { type: number }
        difference: { type: number }

    MissingStatutoryRecord:
      type: object
      required: [workerId, employeeCode, workerName, missingPf, missingEsi]
      properties:
        workerId: { type: string }
        employeeCode: { type: string }
        workerName: { type: string }
        clientName: { type: ["string", "null"] }
        dateOfJoining: { type: ["string", "null"] }
        missingPf: { type: boolean }
        missingEsi: { type: boolean }

    ComplianceRule:
      type: object
      required: [id, state, type, name, configJson, effectiveFrom, isPlaceholder]
      properties:
        id: { type: string }
        tenantId: { type: string }
        legalEntityId: { type: ["string", "null"] }
        state: { type: string }
        type: { type: string, enum: [pt, lwf, min_wage] }
        name: { type: string }
        # JSON-encoded config. Shape depends on `type`:
        # pt → PtRuleConfig, lwf → LwfRuleConfig, min_wage → MinWageRuleConfig
        configJson: { type: string }
        effectiveFrom: { type: string }
        effectiveTo: { type: ["string", "null"] }
        # Stored as "true"/"false" strings; "false" means SME-confirmed.
        isPlaceholder: { type: string, enum: ["true", "false"] }
        notes: { type: ["string", "null"] }
        createdAt: { type: ["string", "null"] }
        updatedAt: { type: ["string", "null"] }

    PtSlab:
      type: object
      required: [upTo, amount]
      properties:
        # null = unbounded top slab
        upTo: { type: ["number", "null"] }
        amount: { type: number }
        # Optional February-only amount (e.g. Maharashtra ₹300)
        februaryAmount: { type: number }

    PtRuleConfig:
      type: object
      required: [slabs]
      properties:
        slabs:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PtSlab"

    LwfRuleConfig:
      type: object
      required: [amount]
      properties:
        amount: { type: number }

    MinWageRuleConfig:
      type: object
      required: [minDailyWage]
      properties:
        minDailyWage: { type: number }
        # Optional zone-label → daily-rate map (e.g. Karnataka Zone 1/2/3).
        # Matched against a site's zone tag; unmatched zones fall back to minDailyWage.
        zoneRates:
          type: object
          additionalProperties: { type: number }

    ComplianceRuleInput:
      type: object
      required: [state, type, name, effectiveFrom, configJson]
      properties:
        state: { type: string, minLength: 1 }
        type: { type: string, enum: [pt, lwf, min_wage] }
        name: { type: string, minLength: 1 }
        effectiveFrom: { type: string, minLength: 1 }
        notes: { type: string }
        legalEntityId: { type: string }
        configJson:
          oneOf:
            - $ref: "#/components/schemas/PtRuleConfig"
            - $ref: "#/components/schemas/LwfRuleConfig"
            - $ref: "#/components/schemas/MinWageRuleConfig"

    # ── BILLING ───────────────────────────────────────────────────────
    BillingRule:
      type: object
      required: [id, clientId, clientName, name, ruleType, effectiveFrom]
      properties:
        id: { type: string }
        clientId: { type: string }
        clientName: { type: string }
        name: { type: string }
        ruleType: { type: string, enum: [markup_percentage, fixed_per_worker, ctc_multiplier] }
        value: { type: number }
        components:
          type: array
          items: { type: string }
        effectiveFrom: { type: string }
        effectiveTo: { type: ["string", "null"] }

    BillingRuleInput:
      type: object
      required: [clientId, name, ruleType, value, effectiveFrom]
      properties:
        clientId: { type: string }
        name: { type: string }
        ruleType: { type: string }
        value: { type: number }
        components:
          type: array
          items: { type: string }
        effectiveFrom: { type: string }
        effectiveTo: { type: string }

    BillingRuleUpdate:
      type: object
      properties:
        name: { type: string }
        value: { type: number }
        effectiveTo: { type: string }

    Invoice:
      type: object
      required: [id, clientId, month, status, totalAmount, createdAt]
      properties:
        id: { type: string }
        invoiceNumber: { type: string }
        clientId: { type: string }
        clientName: { type: ["string", "null"] }
        month: { type: string }
        batchId: { type: ["string", "null"] }
        status: { type: string, enum: [draft, approved, paid, cancelled] }
        workerCount: { type: integer }
        grossPayTotal: { type: string }
        serviceFeeTotal: { type: string }
        subtotal: { type: string }
        gstRate: { type: string }
        gst: { type: string }
        totalAmount: { type: string }
        notes: { type: ["string", "null"] }
        createdAt: { type: string }
        dueDate: { type: ["string", "null"] }
        approvedAt: { type: ["string", "null"] }
        approvedBy: { type: ["string", "null"] }

    InvoiceInput:
      type: object
      required: [clientId, month, batchId]
      properties:
        clientId: { type: string }
        month: { type: string }
        batchId: { type: string }
        gstPercent: { type: number }
        dueDate: { type: string }

    InvoiceAnnexure:
      type: object
      required: [invoice, lineItems, reconciliation]
      properties:
        invoice:
          type: object
          properties:
            id: { type: string }
            invoiceNumber: { type: string }
            clientId: { type: string }
            month: { type: string }
            status: { type: string }
            totalAmount: { type: string }
            subtotal: { type: string }
            gst: { type: string }
            clientName: { type: string, nullable: true }
        lineItems:
          type: array
          items:
            type: object
            properties:
              workerId: { type: string }
              workerName: { type: string }
              employeeCode: { type: string, nullable: true }
              siteName: { type: string, nullable: true }
              presentDays: { type: string, nullable: true }
              grossPay: { type: string }
              serviceFee: { type: string }
              totalBeforeGst: { type: string }
              gst: { type: string }
              totalAmount: { type: string }
        reconciliation:
          type: object
          properties:
            computedTotal: { type: number }
            invoiceTotal: { type: number }
            reconciled: { type: boolean }
            variance: { type: number }

    InvoiceDraftPreview:
      type: object
      required: [internalPreview, invoice, lineItems, reconciliation]
      properties:
        internalPreview: { type: boolean }
        invoice:
          type: object
          properties:
            id: { type: string }
            invoiceNumber: { type: string }
            clientId: { type: string }
            month: { type: string }
            status: { type: string }
            totalAmount: { type: string }
            subtotal: { type: string }
            gst: { type: string }
            clientName: { type: string, nullable: true }
        lineItems:
          type: array
          items:
            type: object
            properties:
              workerId: { type: string }
              workerName: { type: string }
              employeeCode: { type: string, nullable: true }
              siteName: { type: string, nullable: true }
              presentDays: { type: string, nullable: true }
              grossPay: { type: string }
              serviceFee: { type: string }
              totalBeforeGst: { type: string }
              gst: { type: string }
              totalAmount: { type: string }
        reconciliation:
          type: object
          properties:
            computedTotal: { type: number }
            invoiceTotal: { type: number }
            reconciled: { type: boolean }
            variance: { type: number }

    # ── REPORTS ───────────────────────────────────────────────────────
    ReportMeta:
      type: object
      required: [id, name, category, description]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        description: { type: string }
        filters:
          type: array
          items: { type: string }

    PayrollSummaryReport:
      type: object
      required: [month, totalWorkers, totalGross, totalNet, totalDeductions]
      properties:
        month: { type: string }
        totalWorkers: { type: integer }
        totalGross: { type: number }
        totalNet: { type: number }
        totalDeductions: { type: number }
        byClient:
          type: array
          items:
            type: object
            properties:
              clientName: { type: string }
              workers: { type: integer }
              gross: { type: number }
              net: { type: number }
        byState:
          type: array
          items:
            type: object
            properties:
              state: { type: string }
              workers: { type: integer }
              gross: { type: number }

    WorkerPayrollRow:
      type: object
      required: [workerId, workerName, grossPay, netPay]
      properties:
        workerId: { type: string }
        workerName: { type: string }
        employeeCode: { type: string }
        clientName: { type: ["string", "null"] }
        siteName: { type: ["string", "null"] }
        presentDays: { type: number }
        grossPay: { type: number }
        netPay: { type: number }
        pfEmployee: { type: number }
        pfEmployer: { type: number }
        esi: { type: number }
        pt: { type: number }
        lwf: { type: number }

    DownloadItem:
      type: object
      required: [id, name, type, status, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        status: { type: string, enum: [pending, ready, failed] }
        fileUrl: { type: ["string", "null"] }
        createdAt: { type: string }

    # ── DASHBOARDS ────────────────────────────────────────────────────
    ExecutiveDashboard:
      type: object
      required: [totalWorkers, totalClients, totalSites, currentMonthPayroll, pendingActions]
      properties:
        totalWorkers: { type: integer }
        activeWorkers: { type: integer }
        totalClients: { type: integer }
        totalSites: { type: integer }
        currentMonthPayroll: { type: number }
        previousMonthPayroll: { type: number }
        pendingActions:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              label: { type: string }
              count: { type: integer }
              severity: { type: string }
        workersByClient:
          type: array
          items:
            type: object
            properties:
              clientName: { type: string }
              count: { type: integer }
        recentActivity:
          type: array
          items:
            type: object
            properties:
              action: { type: string }
              module: { type: string }
              user: { type: string }
              timestamp: { type: string }

    PayrollDashboard:
      type: object
      required: [month, batches, totalWorkers, totalGross, totalNet]
      properties:
        month: { type: string }
        batches:
          type: array
          items:
            type: object
            properties:
              batchName: { type: string }
              status: { type: string }
              workers: { type: integer }
              gross: { type: number }
        totalWorkers: { type: integer }
        totalGross: { type: number }
        totalNet: { type: number }
        exceptionCount: { type: integer }
        monthlyTrend:
          type: array
          items:
            type: object
            properties:
              month: { type: string }
              gross: { type: number }
              net: { type: number }

    ComplianceDashboard:
      type: object
      required: [totalWorkers, pfEnrolled, esiEnrolled, minWageViolations, minWageBatchId, pfPending, esiPending, pfPendingBatches, esiPendingBatches, pfCoverage, esiCoverage, disclaimer]
      properties:
        totalWorkers: { type: integer }
        pfEnrolled: { type: integer }
        esiEnrolled: { type: integer }
        minWageViolations: { type: integer }
        minWageBatchId: { type: string, nullable: true }
        pfPending: { type: integer }
        esiPending: { type: integer }
        pfPendingBatches:
          type: array
          items:
            $ref: "#/components/schemas/PendingFilingBatch"
        esiPendingBatches:
          type: array
          items:
            $ref: "#/components/schemas/PendingFilingBatch"
        pfCoverage: { type: number }
        esiCoverage: { type: number }
        disclaimer: { type: string }

    PendingFilingBatch:
      type: object
      required: [batchId, name, month, lockedAt, daysSinceLock]
      properties:
        batchId: { type: string }
        name: { type: string }
        month: { type: string }
        lockedAt: { type: string, nullable: true }
        daysSinceLock: { type: integer, nullable: true }

    FinanceDashboard:
      type: object
      required: [month, totalInvoiced, totalPayouts, pendingInvoices]
      properties:
        month: { type: string }
        totalInvoiced: { type: number }
        totalPayouts: { type: number }
        pendingInvoices: { type: integer }
        byClient:
          type: array
          items:
            type: object
            properties:
              clientName: { type: string }
              invoiced: { type: number }
              payout: { type: number }

    # ── AUDIT / EXPORT LOGS ───────────────────────────────────────────
    AuditLog:
      type: object
      required: [id, module, action, entityId, userId, userName, createdAt]
      properties:
        id: { type: string }
        module: { type: string }
        action: { type: string }
        entityId: { type: string }
        entityType: { type: string }
        userId: { type: string }
        userName: { type: string }
        ipAddress: { type: ["string", "null"] }
        changes: { type: object }
        createdAt: { type: string }

    ExportLog:
      type: object
      required: [id, module, exportType, userId, userName, createdAt]
      properties:
        id: { type: string }
        module: { type: string }
        exportType: { type: string }
        filters: { type: object }
        rowCount: { type: ["integer", "null"] }
        fileUrl: { type: ["string", "null"] }
        userId: { type: string }
        userName: { type: string }
        createdAt: { type: string }

    # ── SYSTEM JOBS ───────────────────────────────────────────────────
    SystemJob:
      type: object
      required: [id, type, status, createdAt]
      properties:
        id: { type: string }
        type: { type: string }
        status: { type: string, enum: [pending, running, completed, failed] }
        progress: { type: ["integer", "null"] }
        total: { type: ["integer", "null"] }
        result: { type: object }
        error: { type: ["string", "null"] }
        createdAt: { type: string }
        startedAt: { type: ["string", "null"] }
        completedAt: { type: ["string", "null"] }
