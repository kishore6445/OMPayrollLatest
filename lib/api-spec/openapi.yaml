openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Payroll Nexus API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: tenants
  - name: packages
  - name: users
  - name: roles
  - name: permissions
  - name: organizations
  - name: legalEntities
  - name: clients
  - name: sites
  - name: workers
  - name: workerAssignments
  - name: salarySetup
  - name: attendance
  - name: payroll
  - name: bankFile
  - name: payslips
  - name: compliance
  - name: billing
  - name: reports
  - name: dashboards
  - name: auditLogs
  - name: exportLogs
  - name: systemJobs

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── AUTH ──────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current session
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  # ── TENANTS ───────────────────────────────────────────────────────────
  /tenants:
    get:
      operationId: listTenants
      tags: [tenants]
      summary: List all tenants (Platform Admin only)
      responses:
        "200":
          description: Tenant list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tenant"
    post:
      operationId: createTenant
      tags: [tenants]
      summary: Create a new tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"

  /tenants/{tenantId}:
    get:
      operationId: getTenant
      tags: [tenants]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Tenant detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
    patch:
      operationId: updateTenant
      tags: [tenants]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"

  # ── PACKAGES ──────────────────────────────────────────────────────────
  /packages:
    get:
      operationId: listPackages
      tags: [packages]
      summary: List all packages
      responses:
        "200":
          description: Package list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Package"
    post:
      operationId: createPackage
      tags: [packages]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackageInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Package"

  /tenants/{tenantId}/package:
    get:
      operationId: getTenantPackage
      tags: [packages]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Assigned package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantPackage"
    put:
      operationId: assignTenantPackage
      tags: [packages]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantPackageInput"
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantPackage"

  # ── USERS ─────────────────────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      parameters:
        - { name: roleId, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{userId}:
    get:
      operationId: getUser
      tags: [users]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: User detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [users]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Deleted

  /users/{userId}/reset-password:
    post:
      operationId: resetUserPassword
      tags: [users]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetInput"
      responses:
        "200":
          description: Password reset

  # ── ROLES ─────────────────────────────────────────────────────────────
  /roles:
    get:
      operationId: listRoles
      tags: [roles]
      responses:
        "200":
          description: Role list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
    post:
      operationId: createRole
      tags: [roles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"

  /roles/{roleId}:
    get:
      operationId: getRole
      tags: [roles]
      parameters:
        - { name: roleId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Role detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
    patch:
      operationId: updateRole
      tags: [roles]
      parameters:
        - { name: roleId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
    delete:
      operationId: deleteRole
      tags: [roles]
      parameters:
        - { name: roleId, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Deleted

  /roles/{roleId}/permissions:
    get:
      operationId: getRolePermissions
      tags: [roles]
      parameters:
        - { name: roleId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Role permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Permission"
    put:
      operationId: setRolePermissions
      tags: [roles]
      parameters:
        - { name: roleId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionSetInput"
      responses:
        "200":
          description: Permissions updated

  # ── PERMISSIONS ───────────────────────────────────────────────────────
  /permissions:
    get:
      operationId: listPermissions
      tags: [permissions]
      responses:
        "200":
          description: All defined permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Permission"

  # ── ORGANIZATION ──────────────────────────────────────────────────────
  /organizations:
    get:
      operationId: listOrganizations
      tags: [organizations]
      responses:
        "200":
          description: Organization list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"
    post:
      operationId: createOrganization
      tags: [organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"

  /organizations/{orgId}:
    get:
      operationId: getOrganization
      tags: [organizations]
      parameters:
        - { name: orgId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Organization detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
    patch:
      operationId: updateOrganization
      tags: [organizations]
      parameters:
        - { name: orgId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"

  # ── LEGAL ENTITIES ────────────────────────────────────────────────────
  /legal-entities:
    get:
      operationId: listLegalEntities
      tags: [legalEntities]
      responses:
        "200":
          description: Legal entity list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LegalEntity"
    post:
      operationId: createLegalEntity
      tags: [legalEntities]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegalEntityInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalEntity"

  /legal-entities/{entityId}:
    get:
      operationId: getLegalEntity
      tags: [legalEntities]
      parameters:
        - { name: entityId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Legal entity detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalEntity"
    patch:
      operationId: updateLegalEntity
      tags: [legalEntities]
      parameters:
        - { name: entityId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegalEntityUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalEntity"

  # ── CLIENTS ───────────────────────────────────────────────────────────
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        "200":
          description: Client list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients/{clientId}:
    get:
      operationId: getClient
      tags: [clients]
      parameters:
        - { name: clientId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Client detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
    patch:
      operationId: updateClient
      tags: [clients]
      parameters:
        - { name: clientId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  # ── SITES ─────────────────────────────────────────────────────────────
  /sites:
    get:
      operationId: listSites
      tags: [sites]
      parameters:
        - { name: clientId, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        "200":
          description: Site list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Site"
    post:
      operationId: createSite
      tags: [sites]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"

  /sites/{siteId}:
    get:
      operationId: getSite
      tags: [sites]
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Site detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
    patch:
      operationId: updateSite
      tags: [sites]
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"

  # ── WORKERS ───────────────────────────────────────────────────────────
  /workers:
    get:
      operationId: listWorkers
      tags: [workers]
      parameters:
        - { name: clientId, in: query, schema: { type: string } }
        - { name: siteId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: readiness, in: query, schema: { type: string, enum: [missing-bank, missing-statutory, missing-salary, missing-assignment] } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Paginated worker list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerListPage"
    post:
      operationId: createWorker
      tags: [workers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"

  /workers/bulk-upload:
    post:
      operationId: bulkUploadWorkers
      tags: [workers]
      summary: Bulk import workers from Excel/CSV
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkUploadInput"
      responses:
        "200":
          description: Upload result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkUploadResult"

  /workers/missing-data:
    get:
      operationId: listWorkersWithMissingData
      tags: [workers]
      summary: Active workers missing bank details, statutory profile, or salary structure
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [bank, statutory, salary] } }
        - { name: clientId, in: query, schema: { type: string } }
      responses:
        "200":
          description: Workers with missing data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkerMissingData"

  /workers/{workerId}:
    get:
      operationId: getWorker
      tags: [workers]
      parameters:
        - { name: workerId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Worker profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
    patch:
      operationId: updateWorker
      tags: [workers]
      parameters:
        - { name: workerId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
    delete:
      operationId: deleteWorker
      tags: [workers]
      parameters:
        - { name: workerId, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Deleted

  /workers/{workerId}/bank-details:
    get:
      operationId: getWorkerBankDetails
      tags: [workers]
      parameters:
        - { name: workerId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Bank details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankDetails"
    put:
      operationId: upsertWorkerBankDetails
      tags: [workers]
      parameters:
        - { name: workerId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankDetailsInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankDetails"

  /workers/{workerId}/statutory-profile:
    get:
      operationId: getWorkerStatutoryProfile
      tags: [workers]
      parameters:
        - { name: workerId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Statutory profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatutoryProfile"
    put:
      operationId: upsertWorkerStatutoryProfile
      tags: [workers]
      parameters:
        - { name: workerId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatutoryProfileInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatutoryProfile"

  # ── WORKER ASSIGNMENTS ────────────────────────────────────────────────
  /assignments:
    get:
      operationId: listAssignments
      tags: [workerAssignments]
      parameters:
        - { name: workerId, in: query, schema: { type: string } }
        - { name: clientId, in: query, schema: { type: string } }
        - { name: siteId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        "200":
          description: Assignment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assignment"
    post:
      operationId: createAssignment
      tags: [workerAssignments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"

  /assignments/{assignmentId}:
    get:
      operationId: getAssignment
      tags: [workerAssignments]
      parameters:
        - { name: assignmentId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Assignment detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
    patch:
      operationId: updateAssignment
      tags: [workerAssignments]
      parameters:
        - { name: assignmentId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"

  # ── SALARY SETUP ──────────────────────────────────────────────────────
  /salary-structures:
    get:
      operationId: listSalaryStructures
      tags: [salarySetup]
      parameters:
        - { name: workerId, in: query, schema: { type: string } }
        - { name: clientId, in: query, schema: { type: string } }
      responses:
        "200":
          description: Salary structure list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalaryStructure"
    post:
      operationId: createSalaryStructure
      tags: [salarySetup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalaryStructureInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaryStructure"

  /salary-structures/{structureId}:
    get:
      operationId: getSalaryStructure
      tags: [salarySetup]
      parameters:
        - { name: structureId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Salary structure detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaryStructure"
    patch:
      operationId: updateSalaryStructure
      tags: [salarySetup]
      parameters:
        - { name: structureId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalaryStructureUpdate"
      responses:
        "200":
          description: Updated
